<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">

<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Varlıklarım">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Varlıklarımız</title>
<style>
:root{--bg:#f2f3f7;--card:#fff;--tx:#14161c;--mut:#6b7080;--line:#e4e6ee;--pri:#3b4fd8;--gold:#d9a514;--fx:#2e9e5b;--tl:#3b6fd4;--red:#d64545}
@media(prefers-color-scheme:dark){:root{--bg:#0f1116;--card:#1a1d26;--tx:#eef0f6;--mut:#9097aa;--line:#2a2e3b;--pri:#7b8cff}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif;padding-bottom:calc(90px + env(safe-area-inset-bottom))}
.wrap{max-width:640px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top)) 14px 0}
h1{font-size:26px;margin:6px 2px 14px;display:flex;justify-content:space-between;align-items:center}
.card{background:var(--card);border-radius:18px;padding:16px;margin-bottom:12px}
.hero{background:linear-gradient(135deg,#4a3fd0,#2f7be0);color:#fff}
.hero .big{font-size:38px;font-weight:700;letter-spacing:-.5px;margin:4px 0}
.hero small{opacity:.8}
.seg{display:flex;background:var(--card);border-radius:12px;padding:3px;margin-bottom:12px;gap:2px}
.seg button{flex:1;border:0;background:none;color:var(--mut);padding:8px 4px;border-radius:10px;font:inherit;font-size:14px;font-weight:600}
.seg button.on{background:var(--pri);color:#fff}
.row3{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:10px;margin-bottom:12px}
.mini{background:var(--card);border-radius:16px;padding:12px}
.mini .l{font-size:12px;color:var(--mut);display:flex;align-items:center;gap:6px}
.mini .v{font-weight:700;font-size:16px;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}
.legend div{display:flex;align-items:center;gap:8px;padding:6px 0;font-size:15px}
.legend .n{flex:1}.legend .p{color:var(--mut);width:42px;text-align:right}
.donut{display:block;margin:6px auto 10px}
.gh{display:flex;justify-content:space-between;font-weight:700;margin:16px 4px 8px}
.gh span:last-child{color:var(--mut);font-weight:600}
.item{display:flex;align-items:center;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item .m{flex:1;min-width:0}.item .t{font-weight:600}.item .s{font-size:12px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .r{text-align:right}.item .r .s{display:block}
.pm{width:34px;height:34px;border-radius:50%;border:0;background:var(--line);color:var(--tx);font-size:20px;line-height:1;flex:none}
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
.tabs button{flex:1;border:0;background:none;color:var(--mut);padding:10px 0 8px;font:inherit;font-size:12px;font-weight:600}
.tabs button b{display:block;font-size:20px;line-height:1.1}
.tabs button.on{color:var(--pri)}
.fab{position:fixed;right:18px;bottom:calc(76px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:50%;border:0;background:var(--pri);color:#fff;font-size:30px;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.eye{border:0;background:var(--card);color:var(--tx);border-radius:12px;padding:6px 12px;font-size:18px}
.sheetbg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.sheet{background:var(--card);width:100%;max-width:640px;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto}
.sheet h2{margin:0 0 12px;font-size:20px}
label{display:block;font-size:13px;color:var(--mut);margin:10px 2px 4px}
input,select{width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--tx);font:inherit}
.btns{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.btn{flex:1;min-width:110px;padding:13px;border-radius:12px;border:0;font:inherit;font-weight:700;background:var(--line);color:var(--tx)}
.btn.p{background:var(--pri);color:#fff}.btn.d{background:none;color:var(--red);flex:none;padding:13px 10px}
.note{font-size:12px;color:var(--mut);margin:8px 2px}
.warn{background:#fff4d6;color:#7a5a00;border-radius:12px;padding:10px 12px;font-size:13px;margin-bottom:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom));background:#222;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:20}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{border:1px solid var(--line);background:var(--bg);color:var(--tx);border-radius:999px;padding:6px 12px;font:inherit;font-size:13px}
.chip.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.addto{border:0;background:var(--line);color:var(--tx);border-radius:50%;width:24px;height:24px;margin-left:6px;font-size:14px;line-height:1;vertical-align:middle}
.empty{text-align:center;color:var(--mut);padding:26px 10px}
.item{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.lockbg{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:20px}
.pdots{display:flex;gap:14px;margin:10px 0}.pdot{width:14px;height:14px;border-radius:50%;border:2px solid var(--pri)}.pdot.on{background:var(--pri)}
.keys{display:grid;grid-template-columns:repeat(3,76px);gap:14px;margin-top:8px}
.key{height:76px;border-radius:50%;border:0;background:var(--card);color:var(--tx);font:inherit;font-size:28px;font-weight:600}
#prn{display:none}
@media print{body.printing #app,body.printing #tabs,body.printing #layer,body.printing #login,body.printing #lock{display:none!important}body.printing #prn{display:block;color:#000;background:#fff;padding:10px}#prn table{width:100%;border-collapse:collapse;font-size:12px}#prn td,#prn th{border-bottom:1px solid #ccc;padding:4px;text-align:left}#prn td.r,#prn th.r{text-align:right}}
.item.drag{background:var(--bg);box-shadow:0 4px 14px rgba(0,0,0,.25);border-radius:12px;position:relative;z-index:2}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<nav class="tabs" id="tabs">
  <button data-act="tab" data-v="sum"><b>◔</b>Özet</button>
  <button data-act="tab" data-v="list"><b>☰</b>Varlıklar</button>
  <button data-act="tab" data-v="rates"><b>₺</b>Kurlar</button>
  <button data-act="tab" data-v="set"><b>⚙</b>Ayarlar</button>
</nav>
<div id="layer"></div>
<div id="login"></div>
<div id="lock"></div>
<div id="prn"></div>

<script>
// ---------- Tanımlar ----------
const GROUPS = {gold:{n:'Altın',c:'#d9a514'}, fx:{n:'Döviz',c:'#2e9e5b'}, tl:{n:'TL',c:'#3b6fd4'}, stock:{n:'Hisse',c:'#e34d85'}, crypto:{n:'Kripto',c:'#f7931a'}, fund:{n:'Fon',c:'#0ea5a4'}, deposit:{n:'Vadeli',c:'#6366f1'}, other:{n:'Diğer',c:'#8b5cf6'}, debt:{n:'Borç',c:'#d64545'}};
const PRICED = ['stock','crypto','fund'];       // adet x birim fiyat
const NAMEK = ['custom','debt','deposit'];      // ad + para birimi girilenler
const ALWAYS = ['gold','fx','tl'];
const KINDS = {
  tl:{n:'TL',g:'tl',u:''},
  usd:{n:'Dolar (USD)',g:'fx',u:''},
  eur:{n:'Euro (EUR)',g:'fx',u:''},
  gbp:{n:'Sterlin (GBP)',g:'fx',u:''},
  gram:{n:'Gram altın (fiziki)',g:'gold',u:'gr'},
  bankGram:{n:'Gram altın (banka)',g:'gold',u:'gr'},
  yarimGram:{n:'Yarım gram',g:'gold',u:'adet'},
  ceyrek:{n:'Çeyrek altın',g:'gold',u:'adet'},
  yarim:{n:'Yarım altın',g:'gold',u:'adet'},
  tam:{n:'Tam altın',g:'gold',u:'adet'},
  cumhuriyet:{n:'Cumhuriyet altını',g:'gold',u:'adet'},
  stock:{n:'Hisse senedi (otomatik fiyat)',g:'stock',u:'adet',short:'Hisse'},
  crypto:{n:'Kripto para (otomatik fiyat)',g:'crypto',u:'adet',short:'Kripto'},
  fund:{n:'Yatırım fonu',g:'fund',u:'adet',short:'Fon'},
  deposit:{n:'Vadeli hesap (faizli)',g:'deposit',u:'',short:'Vadeli hesap'},
  debt:{n:'Borç',g:'debt',u:'',short:'Borç'}
};
const RATE_FIELDS = [
  ['usd','Dolar / TL'],['eur','Euro / TL'],['gbp','Sterlin / TL'],
  ['gram','Gram altın (TL)'],['yarimGram','Yarım gram (TL)'],['ceyrek','Çeyrek altın (TL)'],
  ['yarim','Yarım altın (TL)'],['tam','Tam altın (TL)'],['cumhuriyet','Cumhuriyet (TL)']
];
// 4 Kasım 2026 sabahı piyasa değerleri; Sterlin ve Yarım gram tahminidir.
const DEFAULT_RATES = {usd:49.84,eur:55.40,gbp:66.70,gram:6335.51,yarimGram:3168,ceyrek:10436,yarim:20865,tam:41751,cumhuriyet:41576,updated:'2026-11-04',est:true};
const CURS = [['TRY','₺','TL'],['USD','$','USD'],['EUR','€','EUR'],['GBP','£','GBP']];

// ---------- Durum ----------
let S = {assets:[], rates:{...DEFAULT_RATES}, tab:'sum', cur:'TRY', sumMode:'group', listMode:'loc', hidden:false, status:'', auto:true, user:null};
let timers = {}, pending = new Set();
let LP = null, DR = null, noClickUntil = 0;
let fb = null, unsub = null;
try{ S.hidden = localStorage.getItem('hide')==='1'; S.cur = localStorage.getItem('cur')||'TRY'; }catch(e){}

const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
// Türkçe biçim: 1.250,50 (nokta binlik, virgül ondalık). Eksi işaretini korur.
const numTR = s => { const t = String(s||'').replace(/\./g,'').replace(',','.'); const v = parseFloat(t); return isFinite(v)?v:0; };
const fmtIn = n => (+n||0).toLocaleString('tr-TR',{maximumFractionDigits:4});
function fmtMoneyInput(el){
  let v = el.value.replace(/[^0-9,\-]/g,'');
  const neg = el.dataset.neg==='1' && v.startsWith('-');
  v = v.replace(/-/g,'');
  const parts = v.split(',');
  let int = parts[0].replace(/^0+(?=\d)/,'').replace(/\B(?=(\d{3})+(?!\d))/g,'.');
  let out = int; if(parts.length>1) out += ',' + parts.slice(1).join('').slice(0,4);
  el.value = (neg?'-':'') + out;
}
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,7);

// ---------- Hesap ----------
const tlPer = k => k==='tl' ? 1 : k==='bankGram' ? (+S.rates.gram||0) : (+S.rates[k]||0);
const curSym = c => ({tl:'₺',usd:'$',eur:'€',gbp:'£'}[c]||'');
const kindOf = a => a.kind==='custom' ? {n:a.typeName||'Diğer',g:'other',u:''} : (PRICED.includes(a.kind)||a.kind==='debt'||a.kind==='deposit') ? {n:a.typeName||a.symbol||KINDS[a.kind].short,g:KINDS[a.kind].g,u:KINDS[a.kind].u} : (KINDS[a.kind]||KINDS.tl);
const normAsset = (id,o) => ({id, location:String(o.location||''), owner:String(o.owner||''), kind:(o.kind==='custom'||KINDS[o.kind])?o.kind:'tl', typeName:String(o.typeName||''), cur:['tl','usd','eur','gbp'].includes(o.cur)?o.cur:'tl', amount:+o.amount||0, symbol:String(o.symbol||''), price:+o.price||0, cost:+o.cost||0, order:Math.round(+o.order)||0, rate:+o.rate||0, start:String(o.start||''), maturity:String(o.maturity||'')});
// Vadeli hesap: basit faiz, vadeye kadar işler (brüt, stopaj yok)
function depDays(a){ const st = Date.parse(a.start), m = Date.parse(a.maturity); if(!isFinite(st)) return 0; const end = isFinite(m) ? Math.min(Date.now(),m) : Date.now(); return Math.max(0,(end-st)/864e5); }
const tlVal = a => { const q = +a.amount||0;
  if(PRICED.includes(a.kind)) return q*(+a.price||0)*tlPer(a.cur||'tl');
  if(a.kind==='debt') return -q*tlPer(a.cur||'tl');
  if(a.kind==='deposit') return q*(1+(+a.rate||0)/100*depDays(a)/365)*tlPer(a.cur||'tl');
  return q*tlPer(a.kind==='custom' ? (a.cur||'tl') : a.kind); };
const plTL = a => (+a.cost>0) ? tlVal(a) - a.cost : null;
const curInfo = () => CURS.find(c=>c[0]===S.cur) || CURS[0];
function conv(tl){ return S.cur==='TRY' ? tl : tl / (+S.rates[S.cur.toLowerCase()]||1); }
function moneyRaw(tl){
  const v = Math.round(conv(tl));
  return (v<0?'−':'') + curInfo()[1] + Math.abs(v).toLocaleString('tr-TR');
}
function money(tl){ return S.hidden ? '••••••' : moneyRaw(tl); }
const trDate = d => { const m = /^(\d{4})-(\d\d)-(\d\d)/.exec(d||''); return m ? m[3]+'.'+m[2]+'.'+m[1] : ''; };
const todayStr = () => { const d = new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
const intr = a => tlVal(a) - (+a.amount||0)*tlPer(a.cur||'tl');
const sum = items => items.reduce((t,a)=>t+tlVal(a),0);
const fmtAmt = a => (+a.amount||0).toLocaleString('tr-TR',{maximumFractionDigits:2}) + (NAMEK.includes(a.kind) ? ' '+String(a.cur||'tl').toUpperCase() : (kindOf(a).u ? ' '+kindOf(a).u : ''));
function groupBy(items, fn){
  const m = new Map();
  items.forEach(a=>{ const k = fn(a)||'—'; if(!m.has(k)) m.set(k,[]); m.get(k).push(a); });
  return [...m.entries()].map(([name,list])=>({name,list:list.slice().sort((x,y)=>((x.order||0)-(y.order||0))||(x.id<y.id?-1:1)),total:sum(list)})).sort((a,b)=>b.total-a.total);
}

// ---------- Bulut ayarı (Firebase) ----------
// Aşağıdaki değerler boşsa sayfa yalnızca bu cihazda çalışır.
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyBd4INdzdZEefvUFR0BAsVwJ9cE7taWg2w",
  authDomain: "varliklar-46b7e.firebaseapp.com",
  projectId: "varliklar-46b7e",
  storageBucket: "varliklar-46b7e.firebasestorage.app",
  appId: "1:1064165688208:web:0dcbd114efef87f5d7e915"
};
const CLOUD = !!FIREBASE_CONFIG.apiKey;
const FB_VER = '10.12.2';

// ---------- Veri katmanı ----------
function saveLocal(){
  try{
    if(!CLOUD) localStorage.setItem('assets',JSON.stringify(S.assets));
    localStorage.setItem('rates',JSON.stringify(S.rates));
    localStorage.setItem('auto',S.auto?'1':'0');
  }catch(e){ toast('Bu tarayıcı kayıt yapmayı engelliyor'); }
}
function toast(t){
  const el = document.createElement('div'); el.className='toast'; el.textContent=t; document.body.appendChild(el);
  setTimeout(()=>el.remove(),2600);
}
async function persist(a){
  pending.delete(a.id); delete timers[a.id];
  if(CLOUD){
    if(!fb || !S.user){ toast('Giriş yapılmadı'); return; }
    const body = {location:a.location, owner:a.owner, kind:a.kind, typeName:a.typeName||'', cur:a.cur||'tl', amount:+a.amount||0, symbol:a.symbol||'', price:+a.price||0, cost:+a.cost||0, order:Math.round(+a.order)||0, rate:+a.rate||0, start:a.start||'', maturity:a.maturity||''};
    try{ await fb.fs.setDoc(fb.fs.doc(fb.db,'assets',a.id), body); }catch(e){ toast('Kaydedilemedi, bağlantını kontrol et'); }
  } else saveLocal();
}
async function removeAsset(id){
  S.assets = S.assets.filter(a=>a.id!==id); render();
  if(CLOUD){
    try{ await fb.fs.deleteDoc(fb.fs.doc(fb.db,'assets',id)); }catch(e){ toast('Silinemedi'); }
  } else saveLocal();
}
function adjust(id,d){
  const a = S.assets.find(x=>x.id===id); if(!a) return;
  a.amount = Math.max(0,(+a.amount||0)+d); pending.add(id); render();
  clearTimeout(timers[id]); timers[id] = setTimeout(()=>persist(a),400);
}
// ---------- Hisse fiyatları (Yahoo Finance, ~15 dk gecikmeli, resmi olmayan kaynak) ----------
// Tarayıcılar bu istekleri engelleyebilir; o zaman telefon uygulamasının buluta kaydettiği son fiyat kullanılır.
const YCUR = {TRY:'tl',USD:'usd',EUR:'eur',GBP:'gbp'};
async function fetchQuote(sym){
  try{
    const r = await fetch('https://query1.finance.yahoo.com/v8/finance/chart/'+encodeURIComponent(sym)+'?interval=1d&range=1d');
    const j = await r.json(); const m = j.chart.result[0].meta;
    let price = +m.regularMarketPrice, c = m.currency;
    if(c==='GBp'||c==='GBX'){ price /= 100; c = 'GBP'; }
    if(!(price>0) || !YCUR[c]) return null;
    return {price, cur:YCUR[c]};
  }catch(e){ return null; }
}
async function searchStocks(q){
  try{
    const r = await fetch('https://query2.finance.yahoo.com/v1/finance/search?q='+encodeURIComponent(q)+'&quotesCount=10&newsCount=0&lang=tr-TR&region=TR');
    const j = await r.json();
    return (j.quotes||[]).filter(x=>x.symbol && (x.quoteType==='EQUITY'||x.quoteType==='ETF'))
      .map(x=>({symbol:x.symbol, name:x.longname||x.shortname||x.symbol, ex:x.exchDisp||x.exchange||''}));
  }catch(e){ return null; }
}
async function fetchCrypto(ids){
  try{
    const r = await fetch('https://api.coingecko.com/api/v3/simple/price?ids='+encodeURIComponent(ids.join(','))+'&vs_currencies=try');
    const j = await r.json(); const out = {};
    ids.forEach(i=>{ if(j[i] && j[i].try>0) out[i] = j[i].try; });
    return out;
  }catch(e){ return null; }
}
async function searchCrypto(q){
  try{
    const r = await fetch('https://api.coingecko.com/api/v3/search?query='+encodeURIComponent(q));
    const j = await r.json();
    return (j.coins||[]).slice(0,8).map(x=>({symbol:x.id, name:x.name, ex:String(x.symbol||'').toUpperCase()}));
  }catch(e){ return null; }
}
async function refreshStocks(){
  const held = S.assets.filter(a=>a.kind==='stock' && a.symbol);
  for(const sym of [...new Set(held.map(a=>a.symbol))]){
    const q = await fetchQuote(sym); if(!q) continue;
    for(const a of held.filter(x=>x.symbol===sym)){
      if(Math.abs((a.price||0)-q.price)>1e-5 || a.cur!==q.cur){ a.price = q.price; a.cur = q.cur; persist(a); }
    }
  }
  const cs = S.assets.filter(a=>a.kind==='crypto' && a.symbol);
  if(cs.length){
    const m = await fetchCrypto([...new Set(cs.map(a=>a.symbol))]);
    if(m) cs.forEach(a=>{ const p = m[a.symbol]; if(p && (Math.abs((a.price||0)-p)>1e-9 || a.cur!=='tl')){ a.price = p; a.cur = 'tl'; persist(a); } });
  }
  render();
}
async function saveRates(r){ S.rates = r; S.auto = false; render(); saveLocal(); }

// Altın türlerinin has altın karşılığı (gram). Çeyrek 1,75 g, yarım 3,5 g, tam 7 g, cumhuriyet 7,2 g, 22 ayar (0,916)
const COIN_G = {yarimGram:0.5, ceyrek:1.75*0.916, yarim:3.5*0.916, tam:7*0.916, cumhuriyet:7.2*0.916};
async function fetchRates(){
  S.status = 'Kurlar güncelleniyor…'; render();
  try{
    const [fx, gd] = await Promise.all([
      fetch('https://open.er-api.com/v6/latest/USD').then(r=>r.json()),
      fetch('https://api.gold-api.com/price/XAU').then(r=>r.json())
    ]);
    const t = fx.rates.TRY, e = fx.rates.EUR, p = fx.rates.GBP, xau = gd.price;
    if(!(t>0 && e>0 && p>0 && xau>0)) throw new Error('bad');
    const gram = xau/31.1035*t;
    const r = {usd:t, eur:t/e, gbp:t/p, gram, updated:new Date().toLocaleString('tr-TR',{dateStyle:'short',timeStyle:'short'}), est:false};
    Object.keys(COIN_G).forEach(k=>{ r[k] = gram*COIN_G[k]; });
    S.rates = r; S.status = ''; saveLocal();
  }catch(e){
    S.status = 'Kurlar alınamadı, son kayıtlı kurlar kullanılıyor';
  }
  render();
}
function exportData(){
  const json = JSON.stringify({assets:S.assets, rates:S.rates, hist});
  const ta = document.getElementById('bk'); if(ta){ ta.value = json; ta.select(); }
  try{ navigator.clipboard.writeText(json).then(()=>toast('Yedek kopyalandı')).catch(()=>toast('Metni elle kopyala')); }catch(e){ toast('Metni elle kopyala'); }
}
async function importData(){
  const ta = document.getElementById('bk');
  try{

const unitOf = a => { const k = kindOf(a); return k.u ? k.u : (['usd','eur','gbp'].includes(a.kind) ? a.kind.toUpperCase() : String(a.cur||'tl').toUpperCase()); };
const num2 = n => String(Math.round(n*100)/100).replace('.',',');
const csvEsc = x => { x = String(x==null?'':x); return /[;"\n]/.test(x) ? '"'+x.replace(/"/g,'""')+'"' : x; };
const sortedAssets = () => S.assets.slice().sort((x,y)=>(x.location+'|'+x.owner).localeCompare(y.location+'|'+y.owner,'tr') || ((x.order||0)-(y.order||0)));
function buildCSV(){
  const rows = [['Konum','Kişi','Grup','Ad','Miktar','Birim','Değer (TL)','Maliyet (TL)','Kâr/Zarar (TL)']];
  sortedAssets().forEach(a=>{ const k = kindOf(a), pl = a.kind==='deposit' ? intr(a) : plTL(a);
    rows.push([a.location,a.owner,GROUPS[k.g].n,k.n,num2(a.amount),unitOf(a),num2(tlVal(a)),a.cost?num2(a.cost):'',pl!=null?num2(pl):'']); });
  const debt = -sum(S.assets.filter(a=>a.kind==='debt'));
  rows.push([],['','','','Toplam varlık','','',num2(sum(S.assets)+debt)],['','','','Borç','','',num2(debt)],['','','','Net varlık','','',num2(sum(S.assets))]);
  return '﻿' + rows.map(r=>r.map(csvEsc).join(';')).join('\r\n');
}
function downloadCSV(){
  try{

// ---------- PIN kilidi (bu cihazda ekran kilidi) ----------
const sha = async x => {
  try{ const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('vrk|'+x)); return [...new Uint8Array(b)].map(n=>n.toString(16).padStart(2,'0')).join(''); }
  catch(e){ let h = 5381; for(const c of 'vrk|'+x) h = ((h<<5)+h+c.charCodeAt(0))|0; return 'x'+h; }
};
let pinHash = '', pinLen = 4, pinBuf = '', hiddenAt = 0;
try{ pinHash = localStorage.getItem('pinh')||''; pinLen = +localStorage.getItem('pinl')||4; }catch(e){}
function showLock(msg){
  const dots = Array.from({length:pinLen},(_,i)=>`<span class="pdot${i<pinBuf.length?' on':''}"></span>`).join('');
  const keys = ['1','2','3','4','5','6','7','8','9','','0','⌫'].map(k=>k===''?'<span></span>':`<button class="key" data-act="pk" data-v="${k}">${k}</button>`).join('');
  document.getElementById('lock').innerHTML = `<div class="lockbg"><h2>Varlıklarımız</h2><div class="note">PIN gir</div><div class="pdots">${dots}</div><div class="note" style="color:var(--red);min-height:18px">${msg||''}</div><div class="keys">${keys}</div></div>`;
}
async function pinKey(k){
  if(k==='⌫') pinBuf = pinBuf.slice(0,-1); else if(pinBuf.length<pinLen) pinBuf += k;
  if(pinBuf.length===pinLen){
    const h = await sha(pinBuf); pinBuf = '';
    if(h===pinHash){ document.getElementById('lock').innerHTML = ''; return; }
    showLock('Yanlış PIN'); return;
  }
  showLock();
}
function openPinSheet(){
  document.getElementById('layer').innerHTML = `<div class="sheetbg" data-act="closebg"><div class="sheet"><h2>${pinHash?'PIN\'i değiştir':'PIN koy'}</h2>
    <label>Yeni PIN (4 ila 6 rakam)</label><input id="p1" type="password" inputmode="numeric" maxlength="6" autocomplete="off">
    <label>Tekrar</label><input id="p2" type="password" inputmode="numeric" maxlength="6" autocomplete="off">
    <div class="note">Bu PIN yalnızca bu cihazdaki ekranı kilitler. Unutursan Safari'de site verisini silmen gerekir; bulut verin silinmez.</div>
    <div class="btns"><button class="btn" data-act="close">Vazgeç</button><button class="btn p" data-act="pinsave">Kaydet</button></div></div></div>`;
}
async function savePin(){
  const a = document.getElementById('p1').value, b = document.getElementById('p2').value;
  if(!/^\d{4,6}$/.test(a)){ toast('4 ila 6 rakam yaz'); return; }
  if(a!==b){ toast('İki PIN aynı değil'); return; }
  pinHash = await sha(a); pinLen = a.length;
  try{ localStorage.setItem('pinh',pinHash); localStorage.setItem('pinl',String(pinLen)); }catch(e){}
  closeSheet(); render(); toast('PIN kaydedildi');
}
function removePin(){
  pinHash = ''; try{ localStorage.removeItem('pinh'); localStorage.removeItem('pinl'); }catch(e){}
  render(); toast('PIN kaldırıldı');
}
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){ hiddenAt = Date.now(); return; }

});

async function startCloud(){
  try{
    const base = `https://www.gstatic.com/firebasejs/${FB_VER}/`;
    const [appm, authm, fsm] = await Promise.all([
      import(base+'firebase-app.js'), import(base+'firebase-auth.js'), import(base+'firebase-firestore.js')

function donut(slices){
  const R=70, C=2*Math.PI*R, tot = slices.reduce((t,s)=>t+s.v,0)||1; let off=0;
  const segs = slices.map(s=>{ const len = s.v/tot*C; const x = `<circle r="${R}" cx="100" cy="100" fill="none" stroke="${s.c}" stroke-width="28" stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-off}" transform="rotate(-90 100 100)"/>`; off+=len; return x; }).join('');
  return `<svg class="donut" width="200" height="200" viewBox="0 0 200 200"><circle r="${R}" cx="100" cy="100" fill="none" stroke="var(--line)" stroke-width="28"/>${segs}</svg>`;
}
const PAL = ['#5b6cf0','#13a89e','#f08a24','#e0568c','#8b5cf6','#4cb86b','#b5651d','#2aa7d8'];

  else slices = groupBy(pos, a=>S.sumMode==='loc'?a.location:a.owner).map((g,i)=>({n:g.name,c:PAL[i%PAL.length],v:g.total})).filter(s=>s.v>0);

  const minis = Object.keys(GROUPS).filter(g=>ALWAYS.includes(g)||all.some(a=>kindOf(a).g===g)).map(g=>`<div class="mini"><div class="l"><span class="dot" style="background:${GROUPS[g].c}"></span>${GROUPS[g].n}</div><div class="v">${money(sum(all.filter(a=>kindOf(a).g===g)))}</div></div>`).join('');

  const goldKinds = ['gram','bankGram','yarimGram','ceyrek','yarim','tam','cumhuriyet'];
  const gl = goldKinds.map(k=>{ const it = all.filter(a=>a.kind===k); const q = it.reduce((t,a)=>t+(+a.amount||0),0); return q>0 ? {k,q,v:sum(it)} : null; }).filter(Boolean);
  const goldCard = gl.length ? `<div class="card"><div class="gh" style="margin:0 0 6px"><span>Altın varlığımız</span><span>${money(gl.reduce((t,x)=>t+x.v,0))}</span></div>${gl.map(x=>`<div class="item" style="padding:8px 0"><span class="dot" style="background:${GROUPS.gold.c}"></span><div class="m">${esc(KINDS[x.k].n)}</div><div class="r"><div class="t">${S.hidden?'••••':x.q.toLocaleString('tr-TR',{maximumFractionDigits:2})+' '+KINDS[x.k].u}</div><span class="s">${money(x.v)}</span></div></div>`).join('')}</div>` : '';

}

function viewSettings(){
  const nh = Object.keys(hist).length;
  const hs = !CLOUD ? 'Bu cihazda saklanıyor.' : S.histCloud===true ? 'Bulutta saklanıyor, tüm cihazlarda aynı.' : S.histCloud===false ? 'Bulut izin vermedi, bu cihazda saklanıyor. Firestore kurallarına "history" koleksiyonu için izin eklenirse bulutta tutulur.' : 'Henüz kontrol edilmedi.';
  return `<h1>Ayarlar</h1>
  ${CLOUD&&S.user?`<div class="card"><div class="gh" style="margin:0 0 4px"><span>Hesap</span></div><div class="note" style="margin-top:0">Giriş yapılan hesap: ${esc(S.user.email)}</div><div class="btns"><button class="btn" data-act="logout">Çıkış yap</button></div></div>`:''}
  <div class="card"><div class="gh" style="margin:0 0 4px"><span>Güvenlik</span></div>
    <div class="note" style="margin-top:0">${pinHash?'PIN kilidi açık ('+pinLen+' haneli). Uygulama açılırken ve 30 saniyeden uzun arka planda kalınca sorulur.':'PIN kilidi kapalı.'} Bu kilit yalnızca bu cihazın ekranını korur.</div>
    <div class="btns"><button class="btn p" data-act="pinset">${pinHash?'PIN\'i değiştir':'PIN koy'}</button>${pinHash?'<button class="btn" data-act="pinoff">PIN\'i kaldır</button>':''}</div>
  </div>
  <div class="card"><div class="gh" style="margin:0 0 4px"><span>Dışa aktar</span></div>
    <div class="note" style="margin-top:0">Excel dosyası noktalı virgülle ayrılmış CSV olarak iner; Excel'de doğrudan açılır. PDF için yazdırma ekranında "PDF olarak kaydet" seç.</div>
    <div class="btns"><button class="btn" data-act="csv">Excel (CSV)</button><button class="btn" data-act="print">PDF / Yazdır</button></div>
  </div>
  <div class="card"><div class="gh" style="margin:0 0 4px"><span>Geçmiş</span></div>
    <div class="note" style="margin:0">${nh} günlük net varlık kaydı var. ${esc(hs)}</div>
  </div>
  <div class="card"><div class="gh" style="margin:0 0 4px"><span>Yedek</span></div>
    <div class="note" style="margin-top:0">${CLOUD?'Kayıtların bulutta saklanır ve senin ile eşinin cihazlarında aynıdır. Yine de arada yedek almak iyidir.':'Veriler yalnızca bu cihazda, bu tarayıcıda durur. Tarayıcı verisi silinirse kaybolur, düzenli yedek al.'}</div>
    <textarea id="bk" rows="4" style="width:100%;padding:10px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--tx);font:12px monospace" placeholder="Yedek metni burada görünür veya buraya yapıştır"></textarea>
    <div class="btns"><button class="btn" data-act="export">Yedeği al</button><button class="btn" data-act="import">Yedeği yükle</button></div>
  </div>`;
}

function render(){
  if(DR){ DR.pend = true; return; }
  const app = document.getElementById('app');
  const y = window.scrollY;
  app.innerHTML = S.tab==='sum' ? viewSum() : S.tab==='list' ? viewList() : S.tab==='set' ? viewSettings() : viewRates();
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on', b.dataset.v===S.tab));
  window.scrollTo(0,y);
}

// ---------- Düzenleme penceresi ----------
function openSheet(id, pre){
  const a = id ? S.assets.find(x=>x.id===id) : null;
  const locs = [...new Set(S.assets.map(x=>x.location).filter(Boolean))].sort();
  const owners = [...new Set(S.assets.map(x=>x.owner).filter(Boolean))].sort();
  const types = [...new Set(S.assets.filter(x=>x.kind==='custom'&&x.typeName).map(x=>x.typeName))].sort();
  let lastOwner = ''; try{ lastOwner = localStorage.getItem('lastOwner')||''; }catch(e){}
  if(!owners.includes(lastOwner)) lastOwner = owners.length===1 ? owners[0] : '';
  const v = a || Object.assign({location:'',owner:lastOwner,kind:'tl',typeName:'',cur:'tl',amount:0,symbol:'',price:0,cost:0,order:0,rate:0,start:todayStr(),maturity:''}, pre||{});
  const kopts = Object.keys(KINDS).map(k=>`<option value="${k}" ${v.kind===k?'selected':''}>${KINDS[k].n}</option>`).join('')
    + `<option value="custom" ${v.kind==='custom'?'selected':''}>＋ Kendi türüm (araç, ev...)</option>`;
  const copts = [['tl','TL'],['usd','USD'],['eur','EUR'],['gbp','GBP']].map(c=>`<option value="${c[0]}" ${(v.cur||'tl')===c[0]?'selected':''}>${c[1]}</option>`).join('');
  const chips = (list,act,cur) => list.length ? `<div class="chips">${list.map(x=>`<button type="button" class="chip${x===cur?' on':''}" data-act="${act}" data-v="${esc(x)}">${esc(x)}</button>`).join('')}</div>` : '';
  document.getElementById('layer').innerHTML = `
  <div class="sheetbg" data-act="closebg"><div class="sheet">
    <h2>${a?'Varlığı düzenle':'Varlık ekle'}</h2>
    <label>Konum (ev, yazlık, banka adı...)</label>
    <input id="f_loc" value="${esc(v.location)}" placeholder="Yeni konum yaz veya aşağıdan seç">
    ${chips(locs,'pickloc',v.location)}
    <label>Kimin</label>
    <input id="f_own" value="${esc(v.owner)}" placeholder="Kişinin adını yaz">
    ${chips(owners,'pickown',v.owner)}
    <label>Tür</label><select id="f_kind">${kopts}</select>
    <div id="f_custom" style="display:none">
      <label id="f_nl">Türün adı</label><input id="f_tname" value="${esc(NAMEK.includes(v.kind)?v.typeName:'')}" placeholder="Örn. Araç, Kredi kartı">
      ${chips(types,'picktype',v.typeName)}
      <label>Para birimi</label><select id="f_cur">${copts}</select>
      <div class="note" id="f_cnote">Bu türün değeri kurla değişmez, güncel değeri sen yazarsın.</div>
    </div>
    <div id="f_dep" style="display:none">
      <div class="grid2"><div><label>Yıllık faiz (%)</label><input id="f_rate" data-money="1" inputmode="decimal" value="${v.rate?esc(fmtIn(v.rate)):''}" placeholder="45"></div>
      <div><label>Başlangıç</label><input id="f_start" type="date" value="${esc(v.start||'')}"></div></div>
      <label>Vade tarihi</label><input id="f_mat" type="date" value="${esc(v.maturity||'')}">
      <div class="note">Faiz basit olarak günlük işler ve vadede durur; brüt tutardır, stopaj düşülmez.</div>
    </div>
    <div id="f_stock" style="display:none">
      <div id="f_qw"><label id="f_ql">Ara</label><input id="f_q" autocomplete="off" autocapitalize="none" placeholder="Aramak için yaz">
      <div id="f_hits"></div></div>
      <label id="f_syml">Sembol</label><input id="f_sym" value="${esc(v.symbol)}" autocapitalize="none" autocomplete="off" placeholder="THYAO.IS">
      <label>Adı</label><input id="f_sname" value="${esc(PRICED.includes(v.kind)?v.typeName:'')}" placeholder="Örn. Türk Hava Yolları">
      <div class="grid2"><div><label>Birim fiyat</label><input id="f_price" data-money="1" inputmode="decimal" value="${v.price?esc(fmtIn(v.price)):''}"></div>
      <div><label>Para birimi</label><select id="f_scur">${copts}</select></div></div>
      <div class="note" id="f_pnote"></div>
    </div>
    <div class="grid2"><div><label id="f_aml">Miktar</label><input id="f_amt" data-money="1" inputmode="decimal" value="${a?esc(fmtIn(v.amount)):''}"></div>
    <div><label>Ekle / çıkar (örn. 2 veya -2)</label><input id="f_dlt" data-money="1" data-neg="1" inputmode="text" placeholder="0"></div></div>
    <div id="f_costw"><label>Toplam alış maliyeti, TL (isteğe bağlı, kâr/zarar için)</label><input id="f_cost" data-money="1" inputmode="decimal" value="${v.cost?esc(fmtIn(v.cost)):''}"></div>
    <div class="btns">${a?'<button class="btn d" data-act="del" data-id="'+esc(a.id)+'">Sil</button>':''}<button class="btn" data-act="close">Vazgeç</button><button class="btn p" data-act="save" data-id="${a?esc(a.id):''}">Kaydet</button>${a?'':'<button class="btn" data-act="savenew">Kaydet, yenisini ekle</button>'}</div>
  </div></div>`;
  const upd = () => {
    const kv = document.getElementById('f_kind').value, pr = PRICED.includes(kv);
    const show = (i,on) => { document.getElementById(i).style.display = on ? 'block' : 'none'; };
    const txt = (i,t) => { document.getElementById(i).textContent = t; };
    show('f_custom', NAMEK.includes(kv)); show('f_stock', pr); show('f_dep', kv==='deposit');
    show('f_qw', kv==='stock'||kv==='crypto'); show('f_cnote', kv==='custom');
    show('f_costw', !['tl','custom','debt','deposit'].includes(kv));
    const u = kv==='custom' ? 'v' : KINDS[kv].u;
    txt('f_aml', ({stock:'Adet (lot)',crypto:'Miktar',fund:'Adet (pay)',debt:'Borç tutarı',deposit:'Anapara',custom:'Toplam değer'})[kv] || (u==='gr'?'Gram':u==='adet'?'Adet':'Tutar'));
    txt('f_nl', ({custom:'Türün adı',debt:'Borcun adı (örn. Kredi kartı, konut kredisi)',deposit:'Hesap adı (isteğe bağlı)'})[kv] || 'Ad');
    txt('f_syml', ({stock:'Sembol (BIST için sonuna .IS, örn. THYAO.IS)',crypto:'CoinGecko kimliği (örn. bitcoin)',fund:'Fon kodu (isteğe bağlı, örn. TCD)'})[kv] || 'Sembol');
    txt('f_ql', kv==='crypto' ? 'Kripto ara (örn. bitcoin, eth)' : 'Hisse ara (şirket adı veya sembol, örn. THY)');
    txt('f_pnote', kv==='fund' ? 'Fon fiyatı otomatik çekilmez; güncel birim fiyatı sen yaz.' : 'Fiyat sayfa açılınca otomatik güncellenir; alınamazsa son kaydedilen veya elle yazdığın fiyat kullanılır.');
  };
  document.getElementById('f_kind').addEventListener('change',upd); upd();
  let qt;
  document.getElementById('f_q').addEventListener('input', e=>{
    clearTimeout(qt);
    const q = e.target.value.trim(), box = document.getElementById('f_hits');
    if(q.length<2){ box.innerHTML=''; return; }
    qt = setTimeout(async()=>{
      box.innerHTML = '<div class="note">Aranıyor…</div>';
      const r = await (document.getElementById('f_kind').value==='crypto' ? searchCrypto(q) : searchStocks(q));
      const cur = document.getElementById('f_q'); if(!cur || cur.value.trim()!==q) return;
      if(r===null){ box.innerHTML = '<div class="note">Arama bu tarayıcıda çalışmıyor. Sembolü elle yaz.</div>'; return; }
      box.innerHTML = r.length ? '<div class="chips" style="flex-direction:column;align-items:stretch">'+r.map(x=>`<button type="button" class="chip" style="text-align:left;border-radius:12px" data-act="pickstock" data-sym="${esc(x.symbol)}" data-name="${esc(x.name)}">${esc(x.name)}<br><small>${esc(x.symbol)}${x.ex?' · '+esc(x.ex):''}</small></button>`).join('')+'</div>' : '<div class="note">Sonuç bulunamadı. Sembolü elle yazabilirsin.</div>';
    },500);
  });
}
const closeSheet = () => { document.getElementById('layer').innerHTML=''; };

async function saveSheet(id, again){
  const loc = document.getElementById('f_loc').value.trim();
  if(!loc){ toast('Konum yazmalısın'); return; }
  const owner = document.getElementById('f_own').value.trim();
  if(!owner){ toast('Kimin olduğunu yaz'); return; }
  const kind = document.getElementById('f_kind').value;
  const pr = PRICED.includes(kind), nk = NAMEK.includes(kind);
  let typeName = nk ? document.getElementById('f_tname').value.trim() : pr ? document.getElementById('f_sname').value.trim() : '';
  if(kind==='custom' && !typeName){ toast('Türün adını yaz'); return; }
  let symbol = '', price = 0;
  if(pr){
    symbol = document.getElementById('f_sym').value.trim();
    symbol = kind==='stock' ? symbol.toUpperCase() : kind==='crypto' ? symbol.toLowerCase() : symbol;
    if(!symbol && kind!=='fund'){ toast(kind==='crypto'?'Kripto kimliğini yaz':'Hisse sembolünü yaz'); return; }
    price = Math.max(0, numTR(document.getElementById('f_price').value));
    if(!typeName) typeName = kind==='stock' ? symbol.replace('.IS','') : kind==='crypto' ? symbol : 'Fon';
  }
  const cur = nk ? document.getElementById('f_cur').value : pr ? document.getElementById('f_scur').value : 'tl';
  const cost = ['tl','custom','debt','deposit'].includes(kind) ? 0 : Math.max(0, numTR(document.getElementById('f_cost').value));
  const rate = kind==='deposit' ? Math.max(0, numTR(document.getElementById('f_rate').value)) : 0;
  const start = kind==='deposit' ? document.getElementById('f_start').value : '';
  const maturity = kind==='deposit' ? document.getElementById('f_mat').value : '';
  const amount = Math.max(0, numTR(document.getElementById('f_amt').value) + numTR(document.getElementById('f_dlt').value));
  try{ localStorage.setItem('lastOwner',owner); }catch(e){}
  let a = id ? S.assets.find(x=>x.id===id) : null;
  if(a){ Object.assign(a,{location:loc,owner,kind,typeName,cur,amount,symbol,price,cost,rate,start,maturity}); }
  else { a = {id:uid(),location:loc,owner,kind,typeName,cur,amount,symbol,price,cost,order:0,rate,start,maturity}; S.assets.push(a); }
  closeSheet(); render();
  if(again) openSheet(null,{location:loc,owner});
  await persist(a);
}

function pick(el, inputId){
  document.getElementById(inputId).value = el.dataset.v;
  el.parentNode.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on', c===el));
}

// ---------- Olaylar ----------
document.addEventListener('click', e=>{
  if(Date.now()<noClickUntil) return;
  const el = e.target.closest('[data-act]'); if(!el) return;
  const act = el.dataset.act, v = el.dataset.v, id = el.dataset.id;
  if(act==='closebg'){ if(e.target===el) closeSheet(); return; }
  if(act==='adj'){ e.stopPropagation(); adjust(id,+el.dataset.d); return; }
  if(act==='tab'){ S.tab=v; render(); window.scrollTo(0,0); }
  else if(act==='cur'){ S.cur=v; try{localStorage.setItem('cur',v);}catch(_){} render(); }
  else if(act==='smode'){ S.sumMode=v; render(); }
  else if(act==='lmode'){ S.listMode=v; render(); }
  else if(act==='eye'){ S.hidden=!S.hidden; try{localStorage.setItem('hide',S.hidden?'1':'0');}catch(_){} render(); }
  else if(act==='add') openSheet(null);
  else if(act==='addto'){ e.stopPropagation(); const nm = v==='—' ? '' : v; openSheet(null, S.listMode==='loc' ? {location:nm} : {owner:nm}); }
  else if(act==='pickown') pick(el,'f_own');
  else if(act==='pickloc') pick(el,'f_loc');
  else if(act==='pickstock'){
    document.getElementById('f_sym').value = el.dataset.sym;
    document.getElementById('f_sname').value = el.dataset.name;
    document.getElementById('f_hits').innerHTML = '<div class="note">Fiyat alınıyor…</div>';
    const isCrypto = document.getElementById('f_kind').value==='crypto';
    (isCrypto ? fetchCrypto([el.dataset.sym]).then(m=>m&&m[el.dataset.sym]?{price:m[el.dataset.sym],cur:'tl'}:null) : fetchQuote(el.dataset.sym)).then(q=>{
      const h = document.getElementById('f_hits'); if(!h) return;
      if(q){ document.getElementById('f_price').value = fmtIn(q.price); document.getElementById('f_scur').value = q.cur; h.innerHTML = ''; }
      else h.innerHTML = '<div class="note">Fiyat alınamadı, aşağıya elle yazabilirsin.</div>';
    });
  }
  else if(act==='picktype') pick(el,'f_tname');
  else if(act==='pk') pinKey(v);
  else if(act==='pinset') openPinSheet();
  else if(act==='pinsave') savePin();
  else if(act==='pinoff') removePin();
  else if(act==='csv') downloadCSV();
  else if(act==='print') printReport();
  else if(act==='savenew') saveSheet(null,true);
  else if(act==='edit') openSheet(id);
  else if(act==='close') closeSheet();
  else if(act==='save') saveSheet(id||null,false);
  else if(act==='del'){ closeSheet(); removeAsset(id); }
  else if(act==='login') doLogin();
  else if(act==='logout'){ if(fb) fb.au.signOut(fb.auth); }
  else if(act==='fetchrates'){ S.auto = true; saveLocal(); fetchRates(); refreshStocks(); }
  else if(act==='export') exportData();
  else if(act==='import') importData();
  else if(act==='saverates'){
    const r = {...S.rates};
    document.querySelectorAll('[data-rate]').forEach(i=>{ const n = numTR(i.value); if(n>0) r[i.dataset.rate]=n; });
    r.updated = new Date().toLocaleString('tr-TR',{dateStyle:'short',timeStyle:'short'}); r.est = false;
    saveRates(r); toast('Kurlar kaydedildi');
  }
});
document.addEventListener('input', e=>{ if(e.target.dataset && e.target.dataset.money==='1') fmtMoneyInput(e.target); });

// ---------- Basılı tutup sürükleyerek sıralama (aynı grup içinde) ----------
document.addEventListener('pointerdown', e=>{
  const it = e.target.closest ? e.target.closest('.item[data-id]') : null;
  if(!it || e.target.closest('.pm') || DR) return;
  if(LP) clearTimeout(LP.t);
  LP = {sx:e.clientX, sy:e.clientY, t:setTimeout(()=>{
    LP = null; DR = {el:it, id:it.dataset.id}; it.classList.add('drag');
    try{ if(navigator.vibrate) navigator.vibrate(12); }catch(_){}
  }, 450)};
});
document.addEventListener('pointermove', e=>{
  if(LP && Math.hypot(e.clientX-LP.sx, e.clientY-LP.sy)>10){ clearTimeout(LP.t); LP = null; return; }
  if(!DR) return;
  const under = document.elementFromPoint(e.clientX, e.clientY);
  const tg = under && under.closest ? under.closest('.item[data-id]') : null;
  if(!tg || tg===DR.el || tg.parentNode!==DR.el.parentNode) return;
  const r = tg.getBoundingClientRect();
  DR.el.parentNode.insertBefore(DR.el, e.clientY < r.top + r.height/2 ? tg : tg.nextSibling);
});
function endDrag(){
  if(LP){ clearTimeout(LP.t); LP = null; }
  if(!DR) return;
  const d = DR; DR = null; noClickUntil = Date.now()+400;
  d.el.classList.remove('drag');
  const ids = [...d.el.parentNode.querySelectorAll('.item[data-id]')].map(x=>x.dataset.id);
  const items = ids.map(i=>S.assets.find(a=>a.id===i)).filter(Boolean);
  if(items.length){
    const base = Math.min(...items.map(a=>a.order||0));
    items.forEach((a,i)=>{ if((a.order||0)!==base+i){ a.order = base+i; persist(a); } });
  }
  render();
}
document.addEventListener('pointerup', endDrag);
document.addEventListener('pointercancel', endDrag);
document.addEventListener('touchmove', e=>{ if(DR) e.preventDefault(); }, {passive:false});
init();
</script>
